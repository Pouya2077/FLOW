{% load static lucide %}<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLOW · Flooded Roads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.12.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="{% static 'flood/app.css' %}">
  <script type="module" src="{% static 'flood/map.js' %}"></script>
</head>
<body>
  <div id="map" class="map" data-basemap-style="{{ basemap_style }}"></div>

  <form class="search overlay" role="search" autocomplete="off">
    <label class="visually-hidden" for="q">Search a street or area</label>
    <input id="q" name="q" type="search" placeholder="Search a street or area" value="{{ request.GET.q }}">
    <button class="search-button" type="submit" aria-label="Search">
      {% lucide "search" size=20 aria_hidden="true" %}
    </button>
  </form>
  <p id="search-message" class="search-message" role="status" hidden></p>

  <a class="theme-toggle overlay" href="?theme={{ other_theme }}" aria-label="Switch to {{ other_theme }} mode" title="Switch to {{ other_theme }} mode">
    {% if theme == "light" %}{% lucide "moon" size=20 class="icon-moon" aria_hidden="true" %}{% else %}{% lucide "sun" size=20 class="icon-sun" aria_hidden="true" %}{% endif %}
  </a>

  <p id="map-notice" class="map-notice" role="status" hidden></p>
</body>
</html>
