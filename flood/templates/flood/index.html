{% load static lucide %}<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLOW · Flooded Roads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.12.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="{% static 'flood/app.css' %}">
  <script type="module" src="{% static 'flood/map.js' %}"></script>
</head>
<body>
  <div id="map" class="map" data-basemap-style="{{ basemap_style }}"></div>

  {# Observation picker: a custom listbox (not <select>) so the selected option can carry a border. #}
  <div class="picker overlay">
    <button id="picker-button" class="picker-button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="picker-list">
      <span class="picker-value">{{ selected.label|default:"No flood observations yet" }}</span>
      {% lucide "chevron-down" size=20 aria_hidden="true" %}
    </button>
    <ul id="picker-list" class="picker-list" role="listbox" tabindex="-1" aria-label="Flood observation" hidden>
      {% for location in locations %}
      <li id="option-{{ location.slug }}" role="option" data-slug="{{ location.slug }}" aria-selected="{% if location.slug == selected.slug %}true{% else %}false{% endif %}">{{ location.label }}</li>
      {% endfor %}
    </ul>
  </div>

  <a class="theme-toggle overlay" href="?theme={{ other_theme }}{% if selected %}&amp;location={{ selected.slug }}{% endif %}" aria-label="Switch to {{ other_theme }} mode" title="Switch to {{ other_theme }} mode">
    {% if theme == "light" %}{% lucide "moon" size=20 class="icon-moon" aria_hidden="true" %}{% else %}{% lucide "sun" size=20 class="icon-sun" aria_hidden="true" %}{% endif %}
  </a>
</body>
</html>
