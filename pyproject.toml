[project]
name = "flow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-ninja>=1.7.1",
    "lucide[django]>=1.1.4",
    "geopandas>=1.2.0",
    "osmnx>=2.1.1",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "rasterstats>=0.21.0",
    "shapely>=2.1.2",
    "python-dotenv>=1.2.4",
    "tqdm>=4.70.1",
    "requests>=2.34.2",
    "geopy>=2.5.0",
    "scipy>=1.18.1",
    "timezonefinder>=9.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
